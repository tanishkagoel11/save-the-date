<style>
/* Layout: names on top, wavy-bordered paper quiz card in the middle, two ink-drawn dancers in the screen corners.
   Palette: only pink, peach and beige. Two fonts: Cormorant Garamond (display + text), Jost (small labels).
   Finale: jharokha arch save-the-date with the Yosemite proposal scene and a tear-off guest stub.
   Deliberately single (light) theme: it's stationery. */
:root{
  --bg:#f6a2b6; --paper:#fffaf6; --ink:#3a3330; --muted:#8a7b73;
  --pink:#e8a0ae; --pink-soft:#f8dde1; --pink-deep:#c45f72;
  --peach:#f2bf9f; --peach-soft:#fbe7da; --tan:#d2a88d;
  --serif:"Cormorant Garamond","Garamond","Georgia",serif;
  --sans:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{ transition:background .4s;
  color:var(--ink); font-family:var(--serif); font-size:18px; line-height:1.45; font-variant-numeric:lining-nums;
  background:var(--bg);
}
.page{position:relative; min-height:100vh; padding-inline:16px; padding-block:60px 56px; display:flex; flex-direction:column; align-items:center}
#doodles{position:fixed; inset:0; pointer-events:none; z-index:0}
#doodles svg{position:absolute; width:clamp(58px,6.2vw,88px); height:auto; overflow:visible; opacity:.95}
@media (max-width:899px){ #doodles svg{width:52px; opacity:.85} #doodles svg:not(.m){display:none} #doodles svg.m{top:58px!important; width:42px} #doodles{position:absolute} }
body.final{background:#f3c9d2}
body.final #doodles{display:none}
header{position:relative; z-index:1}
#toran{position:absolute; top:0; left:0; width:100%; height:54px; pointer-events:none}

header{text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; margin-top:16px}
.lotus{width:44px; height:28px}
.names{font-family:var(--serif); font-weight:400; font-size:clamp(2.4rem,8.5vw,3.6rem); line-height:1.05; letter-spacing:.02em; margin:6px 0 0; text-wrap:balance}
.names em{font-style:italic; color:#b3263a; font-weight:400}
.sub{font-family:var(--sans); font-size:.7rem; letter-spacing:.24em; text-transform:uppercase; color:#7b3446; margin:10px 0 0}

#stage{position:relative; z-index:2; width:100%; max-width:500px; margin-top:26px}
.card{position:relative; padding:44px 38px 40px; min-height:360px}
.card > .wave{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.card > .inner{position:relative}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.qnum{font-family:var(--sans); font-size:.74rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0}
.dots{display:flex; gap:7px}
.dots i{width:10px; height:10px; border-radius:50%; border:1.3px solid var(--ink); display:block}
.dots i.on:nth-child(odd){background:var(--pink)} .dots i.on:nth-child(even){background:var(--peach)}
.q{font-weight:600; font-size:clamp(1.65rem,6vw,2.05rem); line-height:1.15; margin:0 0 22px; text-wrap:balance}
.opts{display:grid; gap:10px}
.opt{
  font-family:var(--serif); font-size:1.15rem; font-weight:500; text-align:left; color:var(--ink); cursor:pointer;
  background:transparent; border:1.3px solid var(--ink); border-radius:999px; padding:10px 20px;
  transition:background .2s, transform .15s;
}
.opt:hover{transform:translateX(3px); background:#f4ebe3}
.opt:focus-visible{outline:2px dashed var(--tan); outline-offset:3px}
.opt s{color:var(--muted); text-decoration-thickness:1.5px}
.opt.right{background:#e3f1e5; border-color:#6fa57d}
.opt.right::after{content:" ✓"; font-family:var(--sans); color:#3f7d50; font-weight:500}

/* Wrong answer */
.revoked{position:absolute; inset:20px; background:var(--paper); border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px; padding:20px; z-index:2}
.stamp{
  font-family:var(--sans); color:var(--pink-deep); text-transform:uppercase; text-align:center;
  border:2px solid var(--pink-deep); outline:1px solid var(--pink-deep); outline-offset:4px; border-radius:6px; background:#fdf0f1;
  padding:10px 22px 12px; transform:rotate(-6deg); animation:thunk .3s cubic-bezier(.2,1.5,.4,1);
}
.stamp small{display:block; font-size:.78rem; font-weight:500; letter-spacing:.3em}
.stamp b{display:block; font-weight:500; font-size:2rem; letter-spacing:.16em; line-height:1.1}
@keyframes thunk{from{transform:rotate(-6deg) scale(1.8); opacity:0} to{transform:rotate(-6deg) scale(1); opacity:1}}
.roast{font-size:1.3rem; font-style:italic; max-width:28ch; margin:0}
.btn{font-family:var(--sans); font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; color:var(--paper); background:var(--ink); border:none; border-radius:999px; padding:12px 26px}
.btn:hover{background:#5a504b}
.btn:focus-visible{outline:2px dashed var(--tan); outline-offset:3px}
.heart{position:fixed; pointer-events:none; font-size:16px; animation:float .9s ease-out forwards; z-index:9}
@keyframes float{to{transform:translate(var(--dx),-70px); opacity:0}}

/* Dancers: screen corners on wide screens, a row under the card on phones */
.dancers{width:100%; max-width:500px; display:flex; justify-content:space-between; align-items:flex-end; margin-top:18px; pointer-events:none}
.dancers[hidden]{display:none}
.fig{height:170px; width:auto; overflow:visible}
@media (min-width:900px){
  .dancers{position:fixed; inset:auto 0 0 0; width:auto; max-width:none; margin:0; padding:0 5vw 3vh; z-index:1}
  .fig{height:min(54vh,34vw,400px)}
}

/* ===== Finale ===== */
.finale{display:flex; flex-direction:column; align-items:center}
.invite{position:relative; width:100%; max-width:440px; background:var(--paper); border:1px solid #ecdcd0; border-radius:6px 6px 0 0; padding:22px 16px 18px; box-shadow:0 14px 30px -20px rgba(58,51,48,.4)}
.arch{position:relative; padding:18px 8px 0; text-align:center}
.arch > svg.frame{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.arch > *:not(.frame){position:relative}
.approved{display:inline-block; font-family:var(--sans); font-size:.66rem; letter-spacing:.24em; text-transform:uppercase; color:#3f7d50; background:#e3f1e5; border-radius:999px; padding:4px 12px; margin:0}
.std{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(2.6rem,11vw,3.3rem); line-height:1; margin:10px 0 6px}
.couple{font-family:var(--serif); font-weight:500; letter-spacing:.24em; text-transform:uppercase; font-size:1rem; margin:0}
.rule{display:flex; align-items:center; justify-content:center; gap:10px; margin:14px auto; color:var(--tan)}
.rule::before,.rule::after{content:""; width:52px; height:1px; background:var(--tan)}
.rule svg{width:16px; height:16px}
.date{font-family:var(--sans); font-weight:400; font-size:1.15rem; letter-spacing:.14em; text-transform:uppercase; margin:0}
.place{font-family:var(--sans); letter-spacing:.3em; text-transform:uppercase; font-size:.8rem; color:var(--muted); margin:6px 0 0}
.scene{width:100%; margin:16px 0 0; display:block; height:auto}
.caption{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:1.1rem; margin:6px 0 4px}
.stub{
  width:100%; max-width:440px; background:var(--paper); border:1px solid #ecdcd0; border-top:none; border-radius:0 0 6px 6px;
  position:relative; padding:16px 18px 18px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;
  box-shadow:0 14px 30px -20px rgba(58,51,48,.4);
}
.stub::before{content:""; position:absolute; top:-1px; left:14px; right:14px; border-top:2px dashed #e2cfc2}
.stub > div{border-radius:10px; padding:6px 4px}
.stub > div:nth-child(odd){background:#fdf1f2} .stub > div:nth-child(2){background:#fdf3ec}
.stub span{display:block; font-family:var(--sans); font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
.stub b{font-family:var(--serif); font-weight:600; font-size:1.02rem}
.follow{font-family:var(--serif); font-style:italic; font-weight:400; font-size:1.9rem; margin:24px 0 0; text-align:center; line-height:1.15}
.follow small{display:block; font-style:italic; font-size:1.05rem; color:var(--muted)}
.again{margin-top:20px}
.credit{position:relative; z-index:2; font-family:var(--sans); font-size:.68rem; letter-spacing:.14em; color:var(--muted); margin:36px 0 0; text-align:center}
@media (max-width:440px){ .card{padding:40px 28px 34px} .arch{padding-inline:0} }
@media (prefers-reduced-motion: reduce){.stamp,.heart{animation:none}.heart{display:none}.opt{transition:none}}
</style>
</head>

/* wavy hand-drawn border */
function wavyRect(w,h,pad,amp,wl){
  const E=[[pad,pad,w-pad,pad],[w-pad,pad,w-pad,h-pad],[w-pad,h-pad,pad,h-pad],[pad,h-pad,pad,pad]], pts=[];
  E.forEach(([x0,y0,x1,y1])=>{const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),nx=dy/L,ny=-dx/L,n=Math.max(1,Math.round(L/wl)),S=n*14;
    for(let s=0;s<S;s++){const t=s/S,o=Math.sin(2*Math.PI*n*t)*amp;pts.push(f(x0+dx*t+nx*o)+" "+f(y0+dy*t+ny*o))}});
  return "M"+pts.join("L")+"Z";
}
function frame(card){
  const svg=card.querySelector(".wave");
  const draw=()=>{const w=card.clientWidth,h=card.clientHeight;svg.setAttribute("viewBox",`0 0 ${w} ${h}`);

  draw(); if(window.ResizeObserver) new ResizeObserver(draw).observe(card);
}

function miniRose(x,y,r){return `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#f8dde1" stroke="#c98b96" stroke-width=".9"/><path d="M${f(x-r*.5)} ${f(y+r*.1)} C${f(x-r*.45)} ${f(y-r*.6)} ${f(x+r*.5)} ${f(y-r*.6)} ${f(x+r*.45)} ${f(y+r*.1)} C${f(x+r*.35)} ${f(y+r*.5)} ${f(x-r*.2)} ${f(y+r*.45)} ${f(x-r*.15)} ${f(y)}" fill="none" stroke="#c98b96" stroke-width=".8"/>`}
function drawToran(){
  const el=document.getElementById("toran"), Wd=el.clientWidth||innerWidth, seg=Wd<520?110:150, n=Math.ceil(Wd/seg)+1;
  let p=`M0 8`, leaves="", roses="";
  for(let i=0;i<n;i++){const x0=i*seg, cx=x0+seg/2; p+=` Q ${f(cx)} 36 ${f(x0+seg)} 8`;
    for(let k=1;k<12;k++){const t=k/12, x=(1-t)**2*x0+2*(1-t)*t*cx+t*t*(x0+seg), y=(1-t)**2*8+2*(1-t)*t*36+t*t*8,
      tx=2*(1-t)*(cx-x0)+2*t*(x0+seg-cx), ty=2*(1-t)*28+2*t*(-28), ang=Math.atan2(ty,tx)*180/Math.PI, side=k%2?1:-1;
      leaves+=`<ellipse cx="0" cy="${-5*side}" rx="3.2" ry="4.6" transform="translate(${f(x)} ${f(y)}) rotate(${f(ang+side*25)})" fill="${["#fffaf6","#fde3e9","#fffaf6"][k%3]}" stroke="#c4566b" stroke-width=".8"/>`}
    roses+=miniRose(x0,9,5)+miniRose(cx,22,3.6);
  }
  el.innerHTML=`<path d="${p}" fill="none" stroke="#fffaf6" stroke-width="1.3"/>`+leaves+roses;
}

const FLOWER=`<svg viewBox="-8 -8 16 16" aria-hidden="true">${miniRose(0,0,6.5)}</svg>`;

/* ---------- quiz ---------- */
const stage=document.getElementById("stage"), dancers=document.getElementById("dancers"); let i=0;

function renderQ(){
  const item=QUESTIONS[i]; dancers.hidden=false; document.body.classList.remove("final");
  stage.innerHTML=`<div class="card"><svg class="wave" aria-hidden="true"></svg><div class="inner">
    <div class="top"><p class="qnum">Question ${i+1} of ${QUESTIONS.length}</p>
      <div class="dots" aria-hidden="true">${QUESTIONS.map((_,k)=>`<i class="${k<i?"on":""}"></i>`).join("")}</div></div>
    <h2 class="q">${esc(item.q)}</h2>
    <div class="opts">${item.opts.map((o,k)=>`<button class="opt" id="opt-${i}-${k}" data-k="${k}">${o.html||esc(o.t)}</button>`).join("")}</div>
  </div></div>`;
  frame(stage.querySelector(".card"));
  stage.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.k,b)));
}

function hearts(btn){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=btn.getBoundingClientRect(), cols=["#e8a0ae","#f2bf9f","#c45f72","#f2bf9f","#e8a0ae"];
  for(let k=0;k<5;k++){const h=document.createElement("span");h.className="heart";h.textContent="♥";h.style.color=cols[k];
    h.style.left=(r.right-40-k*14)+"px";h.style.top=r.top+"px";h.style.setProperty("--dx",(k*8-16)+"px");h.style.animationDelay=(k*60)+"ms";
    document.body.appendChild(h);setTimeout(()=>h.remove(),1300)}
}

function pick(k,btn){
  const item=QUESTIONS[i], o=item.opts[k];
  if(o.ok){
    btn.classList.add("right"); hearts(btn);
    stage.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    setTimeout(()=>{i++; i<QUESTIONS.length?renderQ():renderFinal()},650);
  }else{
    const over=document.createElement("div"); over.className="revoked";
    over.innerHTML=`<div class="stamp"><small>Guest pass</small><b>Revoked</b></div>
      <p class="roast">${esc(o.fail||item.fail||"Wrong answer. Try again please")}</p>
      <button class="btn" id="retry">Try again</button>`;
    stage.querySelector(".card").appendChild(over);
    const r=over.querySelector("#retry"); r.focus(); r.addEventListener("click",()=>over.remove());
  }
}

function renderFinal(){
  dancers.hidden=true; document.body.classList.add("final");
  stage.innerHTML=`<div class="finale">
    <article class="invite">
      <div class="arch">
        <p class="approved">Guest pass approved</p>
        <h2 class="std">Save the date</h2>
        <p class="couple">Arpit &amp; Tanishka</p>
        <div class="rule">${FLOWER}</div>
        <p class="date">${esc(WEDDING.date)}</p>
        <p class="place">${esc(WEDDING.place)}</p>
        ${sceneSVG()}
        <p class="caption">${esc(WEDDING.caption)}</p>
      </div>
    </article>
    <div class="stub">
      <div><span>Admit</span><b>One good guest</b></div>
      <div><span>Section</span><b>Dance floor</b></div>
      <div><span>Seat</span><b>None. Dance.</b></div>
    </div>
    <p class="follow">Formal invite to follow<small>Keep the date free, no excuses.</small></p>
    <button class="btn again" id="again">Take the quiz again</button>
  </div>`;
  document.getElementById("again").addEventListener("click",()=>{i=0;renderQ();scrollTo({top:0})});
}

function drawDoodles(){
  /* [name, left%, top%, rotation, show on phones?] — kept in the side margins, clear of the card and the dancers */
  const spots=[["jagannath",5,9,0,1],["distance",17,6,-6],["flights",27,15,-4],["crossword",8,27,-8],["passports",21,27,8],["phone",6,42,6],["pizza",24,42,-10],
               ["jaipur",94,9,0,1],["letters",82,6,6],["bangalore",73,16,0],["beach",92,27,4],["thailand",79,29,-5],["drinks",93,43,6]];
  document.getElementById("doodles").innerHTML=spots.map(([n,l,t,r,m])=>DOODLES[n].replace("<svg ",`<svg class="${m?"m":""}" style="left:${l}%;top:${t}%;transform:translateX(-50%) rotate(${r}deg)" `)).join("");
}
drawDoodles(); drawToran(); renderQ();
